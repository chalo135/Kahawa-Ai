<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Sign Up — Kahawa Smart</title>

    <!-- PWA: keep the auth entry point installable + themed and cache the shell -->
    <link rel="manifest" href="manifest.json"/>
    <meta name="theme-color" content="#080c0a"/>
    <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Kahawa"/>
    <meta name="mobile-web-app-capable" content="yes"/>

    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="auth.css"/>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card" id="signup-card">
            <div class="auth-header">
                <div class="auth-logo"><i data-lucide="leaf"></i></div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Kahawa AI to protect your harvest</p>
            </div>

            <!-- novalidate: we show our own plain-language messages instead of
                 the browser's default validation bubbles -->
            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="signup-name">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="user"></i></span>
                        <input type="text" id="signup-name" class="form-input" placeholder="John Doe" required/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="mail"></i></span>
                        <input type="email" id="signup-email" class="form-input" placeholder="farmer@kahawa.com" required/>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="lock"></i></span>
                        <input type="password" id="signup-password" class="form-input" placeholder="••••••••" required/>
                        <button type="button" class="toggle-pwd" id="toggle-pwd-1" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <div class="pwd-strength-container" id="pwd-strength-container">
                        <div class="pwd-bars">
                            <div class="pwd-bar" id="bar-1"></div>
                            <div class="pwd-bar" id="bar-2"></div>
                            <div class="pwd-bar" id="bar-3"></div>
                            <div class="pwd-bar" id="bar-4"></div>
                        </div>
                        <span class="pwd-label" id="pwd-label">Too short</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-confirm">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i data-lucide="check-circle"></i></span>
                        <input type="password" id="signup-confirm" class="form-input" placeholder="••••••••" required/>
                        <button type="button" class="toggle-pwd" id="toggle-pwd-2" aria-label="Toggle password visibility">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="checkbox-group">
                        <input type="checkbox" id="signup-terms" required/>
                        I agree to the Terms and Privacy Policy
                    </label>
                </div>

                <button type="submit" class="btn btn-primary auth-btn" id="signup-btn">
                    Create Account <i data-lucide="user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="auth.js"></script>
    <script src="form-errors.js"></script>
    <script src="signup.js"></script>
    <!-- Register the service worker so the shell is cached from first visit -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () =>
          navigator.serviceWorker.register('sw.js')
            .catch(err => console.warn('Service worker registration failed:', err)));
      }
    </script>
</body>
</html>
